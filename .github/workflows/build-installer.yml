name: Build Windows package

on:
  workflow_dispatch: {}        # run it by hand from the Actions tab
  push:
    tags: ['v*']               # or tag a version (v0.2.0) to also cut a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pywebview pyinstaller

      - name: Build
        run: pyinstaller packaging/LOK-Studio.spec --noconfirm

      - name: Zip
        run: Compress-Archive -Path dist/LOK-Studio -DestinationPath LOK-Studio-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: LOK-Studio-win64
          path: LOK-Studio-win64.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LOK-Studio-win64.zip
