name: Build Windows package

on:
  workflow_dispatch: {}        # run it by hand from the Actions tab
  push:
    tags: ['v*']               # or tag a version (v0.2.0) to also cut a Release

permissions:
  contents: write              # required for the tag build to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pywebview pyinstaller

      - name: Stamp version
        run: |
          $v = "$env:GITHUB_REF_NAME" -replace '^v',''
          if ($v -notmatch '^\d+(\.\d+)*$') { $v = '0.0.0-dev' }   # non-tag runs
          Set-Content app/version.py "# stamped by CI from the git tag`nVERSION = `"$v`""
          Write-Host "version: $v"

      - name: Build
        run: pyinstaller packaging/LOK-Studio.spec --noconfirm

      - name: Zip
        run: Compress-Archive -Path dist/LOK-Studio -DestinationPath LOK-Studio-win64.zip

      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {          # not on the runner image: fetch it
            choco install innosetup -y --no-progress
          }
          $v = "$env:GITHUB_REF_NAME" -replace '^v',''
          if ($v -notmatch '^\d+(\.\d+)*$') { $v = '0.0.0' }   # non-tag runs
          & $iscc /DAppVersion=$v packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: LOK-Studio-win64
          path: |
            LOK-Studio-win64.zip
            dist/LOK-Studio-Setup.exe

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LOK-Studio-win64.zip
            dist/LOK-Studio-Setup.exe
